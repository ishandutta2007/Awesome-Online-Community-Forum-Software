<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1f2937; stroke-width: 1; stroke-opacity: 0.35; }
    
    /* Dynamic Floating / Pulsing Elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.75; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-20px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 150px 80px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1050px 280px; }
    .flow-line { stroke: url(#cyanGrad); stroke-width: 2; stroke-dasharray: 6 6; animation: dashMove 12s linear infinite; fill: none; opacity: 0.6; }
    .flow-line-2 { stroke: url(#primaryGrad); stroke-width: 2; stroke-dasharray: 8 8; animation: dashMove 16s linear infinite reverse; fill: none; opacity: 0.5; }
    
    .floating-card-1 { animation: floatPill 6s ease-in-out infinite; }
    .floating-card-2 { animation: floatPill 7s ease-in-out infinite 1s; }
    .floating-card-3 { animation: floatPill 8s ease-in-out infinite 2s; }

    .particle { animation: floatParticle 5s ease-in-out infinite; }

    /* Foreground Typography */
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #818cf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect class="bg" width="1200" height="360" rx="16" />

  <!-- Grid Pattern -->
  <g class="grid-layer">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Animated Background Orbs / Glows (strictly background behind text) -->
  <g class="bg-effects">
    <circle cx="140" cy="80" r="100" fill="url(#primaryGrad)" filter="url(#nodeGlow)" class="orb-1" opacity="0.3" />
    <circle cx="1060" cy="270" r="130" fill="url(#cyanGrad)" filter="url(#nodeGlow)" class="orb-2" opacity="0.25" />
    <circle cx="980" cy="80" r="70" fill="url(#amberGrad)" filter="url(#nodeGlow)" class="orb-1" opacity="0.2" />

    <!-- Animated Data Flow Curves in background -->
    <path d="M 50 300 Q 300 230 600 290 T 1150 180" class="flow-line" />
    <path d="M 80 80 Q 400 160 700 70 T 1120 120" class="flow-line-2" />
  </g>

  <!-- Floating Floating Tech Badges / Pills (Decorations placed along edges to avoid title overlap) -->
  <g class="floating-decorations">
    <!-- Top-Right Badge: Discourse & Open Source -->
    <g class="floating-card-1" transform="translate(860, 40)">
      <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="17" r="6" fill="#10b981" />
      <text x="36" y="22" class="pill-text">Discourse • Flarum • NodeBB</text>
    </g>

    <!-- Bottom-Left Badge: Fediverse / Q&A -->
    <g class="floating-card-2" transform="translate(80, 290)">
      <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="17" r="6" fill="#6366f1" />
      <text x="36" y="22" class="pill-text">Fediverse • Lemmy • Q&amp;A</text>
    </g>

    <!-- Bottom-Right Badge: SaaS & Enterprise -->
    <g class="floating-card-3" transform="translate(900, 290)">
      <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="17" r="6" fill="#ec4899" />
      <text x="36" y="22" class="pill-text">Hosted SaaS &amp; Communities</text>
    </g>

    <!-- Dynamic Particles -->
    <circle cx="260" cy="100" r="3" fill="#60a5fa" class="particle" style="animation-delay: 0.5s;" />
    <circle cx="340" cy="270" r="2.5" fill="#a78bfa" class="particle" style="animation-delay: 1.2s;" />
    <circle cx="820" cy="240" r="3.5" fill="#f472b6" class="particle" style="animation-delay: 2.1s;" />
    <circle cx="940" cy="130" r="2" fill="#34d399" class="particle" style="animation-delay: 1.7s;" />
  </g>

  <!-- Central Foreground Content (Guaranteed Unobscured) -->
  <g class="foreground" transform="translate(600, 0)" text-anchor="middle">
    <!-- Tagline Badge -->
    <rect x="-140" y="70" width="280" height="28" rx="14" fill="#312e81" fill-opacity="0.6" stroke="#4f46e5" stroke-width="1" />
    <text x="0" y="89" class="tagline">⚡ Curated Knowledge &amp; Tech Index ⚡</text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="160" class="title">
      Awesome Online Community &amp; Forum Software
    </text>

    <!-- Subtitle -->
    <text x="0" y="202" class="subtitle">
      A comprehensive guide to Open-Source Forums, Fediverse Platforms, Q&amp;A Systems, and Commercial SaaS
    </text>
    <text x="0" y="228" class="subtitle" style="font-size: 14px; fill: #64748b;">
      Star history • Real-time features • SSO &amp; SAML • Community management architectures
    </text>

    <!-- Subtle Center Divider Accent -->
    <line x1="-120" y1="255" x2="120" y2="255" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
