<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#07090e"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="amberGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ef4444"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="nodeGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.15) translate(15px,-10px);opacity:.75}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-20px) translateX(15px);opacity:.8}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.bg{fill:url(#bgGrad)}.grid-line{stroke:#1f2937;stroke-width:1;stroke-opacity:.35}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:150px 80px}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1050px 280px}.flow-line,.flow-line-2{stroke:url(#cyanGrad);stroke-width:2;stroke-dasharray:6 6;animation:dashMove 12s linear infinite;fill:none;opacity:.6}.flow-line-2{stroke:url(#primaryGrad);stroke-dasharray:8 8;animation:dashMove 16s linear infinite reverse;opacity:.5}.floating-card-1{animation:floatPill 6s ease-in-out infinite}.floating-card-2{animation:floatPill 7s ease-in-out infinite 1s}.floating-card-3{animation:floatPill 8s ease-in-out infinite 2s}.particle{animation:floatParticle 5s ease-in-out infinite}.title{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.pill-text,.subtitle,.tagline,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;font-size:16px;fill:#94a3b8;letter-spacing:.2px}.pill-text,.tagline{font-weight:600}.tagline{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;fill:#818cf8}.pill-text{font-size:12px;fill:#e2e8f0}</style><rect width="1200" height="360" class="bg" rx="16"/><g class="grid-layer"><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="300" y2="300" class="grid-line"/><line x1="150" x2="150" y1="0" y2="360" class="grid-line"/><line x1="300" x2="300" y1="0" y2="360" class="grid-line"/><line x1="450" x2="450" y1="0" y2="360" class="grid-line"/><line x1="600" x2="600" y1="0" y2="360" class="grid-line"/><line x1="750" x2="750" y1="0" y2="360" class="grid-line"/><line x1="900" x2="900" y1="0" y2="360" class="grid-line"/><line x1="1050" x2="1050" y1="0" y2="360" class="grid-line"/></g><g class="bg-effects"><circle cx="140" cy="80" r="100" fill="url(#primaryGrad)" class="orb-1" filter="url(#nodeGlow)" opacity=".3"/><circle cx="1060" cy="270" r="130" fill="url(#cyanGrad)" class="orb-2" filter="url(#nodeGlow)" opacity=".25"/><circle cx="980" cy="80" r="70" fill="url(#amberGrad)" class="orb-1" filter="url(#nodeGlow)" opacity=".2"/><path d="M 50 300 Q 300 230 600 290 T 1150 180" class="flow-line"/><path d="M 80 80 Q 400 160 700 70 T 1120 120" class="flow-line-2"/></g><g class="floating-decorations"><g class="floating-card-1" transform="translate(860, 40)"><rect width="180" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="6" fill="#10b981"/><text x="36" y="22" class="pill-text">Discourse • Flarum • NodeBB</text></g><g class="floating-card-2" transform="translate(80, 290)"><rect width="210" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="6" fill="#6366f1"/><text x="36" y="22" class="pill-text">Fediverse • Lemmy • Q&amp;A</text></g><g class="floating-card-3" transform="translate(900, 290)"><rect width="210" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="6" fill="#ec4899"/><text x="36" y="22" class="pill-text">Hosted SaaS &amp; Communities</text></g><circle cx="260" cy="100" r="3" fill="#60a5fa" class="particle" style="animation-delay:.5s"/><circle cx="340" cy="270" r="2.5" fill="#a78bfa" class="particle" style="animation-delay:1.2s"/><circle cx="820" cy="240" r="3.5" fill="#f472b6" class="particle" style="animation-delay:2.1s"/><circle cx="940" cy="130" r="2" fill="#34d399" class="particle" style="animation-delay:1.7s"/></g><g class="foreground" text-anchor="middle" transform="translate(600, 0)"><rect width="280" height="28" x="-140" y="70" fill="#312e81" fill-opacity=".6" stroke="#4f46e5" stroke-width="1" rx="14"/><text x="0" y="89" class="tagline">⚡ Curated Knowledge &amp; Tech Index ⚡</text><text x="0" y="160" class="title">Awesome Online Community &amp; Forum Software</text><text x="0" y="202" class="subtitle">A comprehensive guide to Open-Source Forums, Fediverse Platforms, Q&amp;A Systems, and Commercial SaaS</text><text x="0" y="228" class="subtitle" style="font-size:14px;fill:#64748b">Star history • Real-time features • SSO &amp; SAML • Community management architectures</text><line x1="-120